name: Delivery Build and Push

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: chapchap-delivery-service

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-22.04

    steps:
      # Repository Checkout
      - name: Checkout
        uses: actions/checkout@v7

      # Java 21 설정
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Gradle Wrapper 실행 권한
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # 테스트
      - name: Test
        run: ./gradlew test --no-daemon

      # GHCR 로그인
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker 이미지 Build 및 Push
      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}

          echo "Building ${IMAGE}:${GITHUB_RUN_NUMBER}"

          docker build \
            -t "${IMAGE}:${GITHUB_RUN_NUMBER}" \
            .

          docker push "${IMAGE}:${GITHUB_RUN_NUMBER}"